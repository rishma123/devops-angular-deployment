name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Clean old installs
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      - name: Install dependencies fresh
        run: npm install

      - name: Build Angular project
        run: npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-central-1

      - name: Upload to S3
        run: aws s3 sync dist/portfolio-final/browser s3://rishma-portfolio-site --delete

      - name: CloudFront Invalidation
        run: aws cloudfront create-invalidation --distribution-id EXQIR3MGHO7CU --paths "/*"
