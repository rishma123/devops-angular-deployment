name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Clear Angular & Node cache
        run: rm -rf node_modules .angular package-lock.json

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      # ---- FIX TAILWIND ANGULAR BUILD ----
      - name: Ensure PostCSS config
        run: |
          echo "module.exports = { plugins: { '@tailwindcss/postcss': {} } };" > postcss.config.js
          cat postcss.config.js

      - name: Build Angular project
        run: npm run build

      # ---- INSTALL AWS CLI ----
      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y awscli

      # ---- DEPLOY TO S3 ----
      - name: Upload to S3
        run: |
          aws s3 sync dist/portfolio-final/browser s3://rishma-portfolio-site --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1

      # ---- INVALIDATE CLOUDFRONT ----
      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation --distribution-id EXQIR3MGHO7CU --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
