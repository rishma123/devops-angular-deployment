name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout repo
        uses: actions/checkout@v3

      # Force delete ALL node_modules + lock file
      - name: Clean install folders
        run: |
          rm -rf node_modules
          rm -f package-lock.json

      # Install Node (NO CACHE FLAG)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # Fresh install
      - name: Install dependencies
        run: npm install

      # Show PostCSS config (debug)
      - name: Debug postcss config
        run: cat postcss.config.js

      # Build Angular project
      - name: Build Angular
        run: npm run build

      # Upload to S3
      - name: Upload to S3
        run: aws s3 sync dist/portfolio-final/browser s3://rishma-portfolio-site --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1

      # CloudFront cache invalidation
      - name: CloudFront Invalidate
        run: aws cloudfront create-invalidation --distribution-id EXQIR3MGHO7CU --paths "/*"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-central-1
